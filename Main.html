<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Application Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef2;--panel:#f7f9fb;--ink:#13233a;--mute:#5d6b7c;--line:#cdd6df;
--saved:#7a8ba0;--applied:#2f6fdb;--interview:#d98a00;--offer:#12805c;--rejected:#b4483f;--accent:#13233a;--on-accent:#f7f9fb}
@media(prefers-color-scheme:dark){:root{--bg:#0e1724;--panel:#16233a;--ink:#e6edf5;--mute:#93a2b5;--line:#2a3b55;
--saved:#8a9bb0;--applied:#5b94f2;--interview:#f0a828;--offer:#35b58a;--rejected:#e0746b;--accent:#e6edf5;--on-accent:#0e1724}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif;min-height:100vh}
h1,h2,.company{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
header{padding:28px clamp(16px,4vw,48px) 8px;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1}
.sub{color:var(--mute);margin:6px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--rejected)}
:focus-visible{outline:2px solid var(--applied);outline-offset:2px}
#search{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:8px;min-width:200px}
.pipeline{margin:16px clamp(16px,4vw,48px) 0}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);gap:2px}
.bar i{display:block;transition:flex-grow .4s}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:10px;color:var(--mute);font-size:14px}
.legend b{color:var(--ink);font-weight:600}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px}
.board{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:14px;padding:22px clamp(16px,4vw,48px) 48px;overflow-x:auto}
.col{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:12px;min-height:300px}
.col.over{outline:2px dashed var(--c);outline-offset:-4px}
.col h2{margin:0 0 10px;font-size:17px;font-weight:600;display:flex;justify-content:space-between}
.col h2 small{color:var(--mute);font-family:Figtree,sans-serif;font-weight:500}
.card{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:10px 12px;margin-bottom:10px;cursor:grab;text-align:left;width:100%;display:block}
.card:hover{border-color:var(--ink)}
.card.drag{opacity:.4}
.company{font-weight:600;font-size:16px}
.role{color:var(--mute)}
.meta{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;padding:6px 2px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,94vw)}
dialog::backdrop{background:rgba(10,20,35,.55)}
form{padding:22px;display:grid;gap:12px}
form h2{margin:0 0 4px;font-size:22px}
label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
label input,label select,label textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 10px;border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:4px}
[hidden]{display:none!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:600}
.sheet{margin:22px clamp(16px,4vw,48px) 48px;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{position:sticky;top:0;background:var(--panel);font-weight:600;white-space:nowrap}
th button{border:0;background:none;font:inherit;font-weight:600;cursor:pointer;padding:0}
th button:hover{text-decoration:underline}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
td.n{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
td.d,td.s{white-space:nowrap}
td a{color:inherit}
select.st{border:1px solid var(--line);border-left:4px solid var(--c);background:var(--bg);color:var(--ink);padding:4px 6px;border-radius:6px}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin:18px clamp(16px,4vw,48px) 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip span{color:var(--mute);font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip[aria-pressed=true] span{color:inherit;opacity:.8}
.filters label{display:grid;gap:2px;font-size:13px;color:var(--mute)}
.filters label input,.filters label select{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 8px;border-radius:8px}
.filters label.chk{display:flex;gap:6px;align-items:center;padding-bottom:6px}
#count{color:var(--mute);font-size:14px;padding-bottom:7px;margin-left:auto}
tr.grp{cursor:pointer;background:var(--bg)}
tr.grp td{border-left:4px solid var(--c);padding:10px 12px;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:16px}
tr.grp .cnt{color:var(--mute);font-family:Figtree,sans-serif;font-size:14px;margin-left:6px}
tr.grp:hover{background:var(--line)}
tr td.empty{padding:16px 12px}
.board{grid-template-columns:repeat(var(--n,5),minmax(240px,1fr))!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Job applications</h1>
    <p class="sub" id="summary"></p>
  </div>
  <div class="tools">
    <input id="search" type="search" placeholder="Search company or role" aria-label="Search applications">
    <div class="seg" role="group" aria-label="View"><button id="vBoard" aria-pressed="true">Board</button><button id="vSheet" aria-pressed="false">Sheet</button></div>
    <button class="btn" id="export">Export</button>
    <button class="btn" id="import">Import</button>
    <button class="btn primary" id="add">Add application</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</header>
<div class="pipeline"><div class="bar" id="bar"></div><div class="legend" id="legend"></div></div>
<div class="filters">
  <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
  <label>Applied from<input type="date" id="fFrom"></label>
  <label>Applied to<input type="date" id="fTo"></label>
  <label>Posting<select id="fExp"><option value="any">Any</option><option value="live">Still open</option><option value="expired">Expired</option></select></label>
  <label class="chk"><input type="checkbox" id="fGroup" checked> Group sheet by status</label>
  <button class="btn" id="fClear" hidden>Clear filters</button>
  <span id="count"></span>
</div>
<main class="board" id="board"></main>
<main class="sheet" id="sheet" hidden></main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Add application</h2>
    <div class="row">
      <label>Company<input name="company" required></label>
      <label>Role<input name="role" required></label>
    </div>
    <div class="row">
      <label>Status<select name="status"></select></label>
      <label>Date applied<input name="date" type="date"></label>
    </div>
    <div class="row">
      <label>Salary or range<input name="salary" placeholder="e.g. 80–95k"></label>
      <label>Job posting link<input name="url" type="url" placeholder="https://"></label>
    </div>
    <label>Notes<textarea name="notes" rows="4" placeholder="Contacts, interview dates, follow-ups"></textarea></label>
    <div class="actions">
      <button type="button" class="btn danger" id="del" hidden>Delete</button>
      <span style="flex:1"></span>
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button class="btn primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<script>
const STAGES=[["saved","Saved"],["applied","Applied"],["interview","Interview"],["offer","Offer"],["rejected","Rejected"]];
const KEY="job-tracker-v1";
let apps=[],editing=null,q="",view="board",sort={k:"date",d:-1};
let group=true,filt={st:new Set(),from:"",to:"",exp:"any"};const collapsed=new Set();
try{view=localStorage.getItem("job-tracker-view")==="sheet"?"sheet":"board";group=localStorage.getItem("job-tracker-group")!=="0"}catch(e){}
const isExp=a=>/Posting expired/.test(a.notes||"");
const match=(a,skipSt)=>{
  if(!(a.company+" "+a.role).toLowerCase().includes(q))return false;
  if(!skipSt&&filt.st.size&&!filt.st.has(a.status))return false;
  if(filt.from&&!(a.date&&a.date>=filt.from))return false;
  if(filt.to&&!(a.date&&a.date<=filt.to))return false;
  if(filt.exp==="live"&&isExp(a))return false;
  if(filt.exp==="expired"&&!isExp(a))return false;
  return true;
};
const SEED=JSON.parse(document.getElementById("seed").textContent);
try{const s=localStorage.getItem(KEY);apps=s===null?SEED.slice():(JSON.parse(s)||[]);if(s===null)localStorage.setItem(KEY,JSON.stringify(apps))}catch(e){apps=SEED.slice()}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(apps))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const days=d=>d?Math.max(0,Math.floor((Date.now()-new Date(d+"T00:00"))/864e5)):null;
$("form").status.innerHTML=STAGES.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");

function render(){
  const f=apps.filter(a=>match(a));
  $("chips").innerHTML=STAGES.map(([k,l])=>`<button class="chip" data-s="${k}" aria-pressed="${filt.st.has(k)}" style="--c:var(--${k})">${l} <span>${apps.filter(a=>match(a,true)&&a.status===k).length}</span></button>`).join("");
  $("count").textContent=`${f.length} of ${apps.length} shown`;
  $("fClear").hidden=!(q||filt.st.size||filt.from||filt.to||filt.exp!=="any");
  $("fGroup").checked=group;
  const n=s=>apps.filter(a=>a.status===s).length;
  const active=n("applied")+n("interview");
  $("summary").textContent=apps.length?`${apps.length} tracked, ${active} active, ${n("offer")} offer${n("offer")===1?"":"s"}`:"Nothing tracked yet. Add your first application.";
  $("bar").innerHTML=STAGES.map(([k,l])=>`<i title="${l}: ${n(k)}" style="background:var(--${k});flex-grow:${n(k)};flex-basis:0"></i>`).join("");
  $("legend").innerHTML=STAGES.map(([k,l])=>`<span style="--c:var(--${k})"><b>${n(k)}</b> ${l}</span>`).join("");
  const shown=STAGES.filter(([k])=>!filt.st.size||filt.st.has(k));
  $("board").style.setProperty("--n",shown.length);
  $("board").innerHTML=shown.map(([k,l])=>{
    const items=f.filter(a=>a.status===k).sort((a,b)=>(b.updated||0)-(a.updated||0));
    return `<section class="col" data-s="${k}" style="--c:var(--${k})"><h2>${l}<small>${items.length}</small></h2>`+
    (items.map(a=>{const d=days(a.date);return `<button class="card" draggable="true" data-id="${a.id}" style="--c:var(--${k})">
      <div class="company">${esc(a.company)}</div><div class="role">${esc(a.role)}</div>
      <div class="meta"><span>${d===null?"No date":d===0?"Applied today":d+" day"+(d===1?"":"s")+" ago"}</span><span>${esc(a.salary)}</span></div></button>`}).join("")||`<div class="empty">${q?"No matches":"Drag cards here"}</div>`)+`</section>`}).join("");
  $("board").hidden=view!=="board";$("sheet").hidden=view!=="sheet";
  $("vBoard").setAttribute("aria-pressed",view==="board");$("vSheet").setAttribute("aria-pressed",view==="sheet");
  if(view==="sheet")renderSheet(f);
}
function renderSheet(f){
  const cols=[["company","Company"],["role","Role"],["status","Status"],["date","Applied"],["salary","Salary"],["notes","Notes"]];
  const order=STAGES.map(s=>s[0]);
  const val=(a,k)=>k==="status"?order.indexOf(a.status):(a[k]||"").toLowerCase();
  const cmp=(a,b)=>{const x=val(a,sort.k),y=val(b,sort.k);return(x>y?1:x<y?-1:0)*sort.d};
  const fmt=d=>d?new Date(d+"T00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";
  const row=a=>`<tr data-id="${a.id}"><td><b>${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.company)}</a>`:esc(a.company)}</b></td><td>${esc(a.role)}</td>
   <td class="s"><select class="st" data-id="${a.id}" aria-label="Status for ${esc(a.company)}" style="--c:var(--${a.status})">${STAGES.map(([k,l])=>`<option value="${k}"${k===a.status?" selected":""}>${l}</option>`).join("")}</select></td>
   <td class="d">${fmt(a.date)}</td><td class="d">${esc(a.salary)}</td><td class="n" title="${esc(a.notes)}">${esc(a.notes)}</td></tr>`;
  const head=`<thead><tr>`+cols.map(([k,l])=>`<th aria-sort="${sort.k===k?(sort.d>0?"ascending":"descending"):"none"}"><button data-k="${k}">${l}${sort.k===k?(sort.d>0?" ▲":" ▼"):""}</button></th>`).join("")+`</tr></thead>`;
  let body="";
  if(group){
    for(const [k,l] of STAGES){
      const rows=f.filter(a=>a.status===k).sort(cmp);if(!rows.length)continue;
      const c=collapsed.has(k);
      body+=`<tr class="grp" data-g="${k}" tabindex="0" aria-expanded="${!c}" style="--c:var(--${k})"><td colspan="6">${c?"▸":"▾"} <b>${l}</b><span class="cnt">${rows.length}</span></td></tr>`+(c?"":rows.map(row).join(""));
    }
  }else body=f.slice().sort(cmp).map(row).join("");
  if(!body)body=`<tr><td colspan="6" class="empty">No applications match these filters.</td></tr>`;
  $("sheet").innerHTML=`<table>${head}<tbody>${body}</tbody></table>`;
}
function openDlg(a){
  editing=a?a.id:null;const f=$("form");
  $("dlgTitle").textContent=a?"Edit application":"Add application";
  for(const k of ["company","role","status","date","salary","url","notes"])f[k].value=a?a[k]||"":(k==="status"?"applied":k==="date"?new Date().toISOString().slice(0,10):"");
  $("del").hidden=!a;$("dlg").showModal();f.company.focus();
}
$("add").onclick=()=>openDlg();
$("cancel").onclick=()=>$("dlg").close();
$("del").onclick=()=>{if(confirm("Delete this application?")){apps=apps.filter(a=>a.id!==editing);save();render();$("dlg").close()}};
$("form").onsubmit=e=>{
  const f=e.target,data=Object.fromEntries(["company","role","status","date","salary","url","notes"].map(k=>[k,f[k].value.trim()]));
  if(editing){Object.assign(apps.find(a=>a.id===editing),data,{updated:Date.now()})}
  else apps.push({id:crypto.randomUUID(),...data,updated:Date.now()});
  save();render();
};
$("search").oninput=e=>{q=e.target.value.toLowerCase();render()};

const setView=v=>{view=v;try{localStorage.setItem("job-tracker-view",v)}catch(e){}render()};
$("vBoard").onclick=()=>setView("board");$("vSheet").onclick=()=>setView("sheet");
const sheet=$("sheet");
sheet.onclick=e=>{
  const b=e.target.closest("th button");
  if(b){sort=sort.k===b.dataset.k?{k:sort.k,d:-sort.d}:{k:b.dataset.k,d:b.dataset.k==="date"?-1:1};return render()}
  const g=e.target.closest("tr.grp");
  if(g){collapsed.has(g.dataset.g)?collapsed.delete(g.dataset.g):collapsed.add(g.dataset.g);return render()}
  if(e.target.closest("select,a"))return;
  const r=e.target.closest("tr[data-id]");if(r)openDlg(apps.find(a=>a.id===r.dataset.id));
};
sheet.onchange=e=>{const s=e.target.closest("select.st");if(!s)return;const a=apps.find(x=>x.id===s.dataset.id);a.status=s.value;a.updated=Date.now();save();render()};
sheet.onkeydown=e=>{if(e.key==="Enter"&&e.target.matches("tr.grp"))e.target.click()};
$("chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const s=c.dataset.s;filt.st.has(s)?filt.st.delete(s):filt.st.add(s);render()};
$("fFrom").onchange=e=>{filt.from=e.target.value;render()};
$("fTo").onchange=e=>{filt.to=e.target.value;render()};
$("fExp").onchange=e=>{filt.exp=e.target.value;render()};
$("fGroup").onchange=e=>{group=e.target.checked;try{localStorage.setItem("job-tracker-group",group?"1":"0")}catch(_){}render()};
$("fClear").onclick=()=>{filt={st:new Set(),from:"",to:"",exp:"any"};q="";$("search").value="";$("fFrom").value=$("fTo").value="";$("fExp").value="any";render()};
const board=$("board");let dragId=null;
board.onclick=e=>{const c=e.target.closest(".card");if(c)openDlg(apps.find(a=>a.id===c.dataset.id))};
board.ondragstart=e=>{const c=e.target.closest(".card");if(!c)return;dragId=c.dataset.id;c.classList.add("drag");e.dataTransfer.effectAllowed="move"};
board.ondragend=()=>{dragId=null;render()};
board.ondragover=e=>{const c=e.target.closest(".col");if(c){e.preventDefault();document.querySelectorAll(".col").forEach(x=>x.classList.toggle("over",x===c))}};
board.ondrop=e=>{e.preventDefault();const c=e.target.closest(".col"),a=apps.find(x=>x.id===dragId);if(c&&a){a.status=c.dataset.s;a.updated=Date.now();save()}render()};

$("export").onclick=()=>{const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(apps,null,2)],{type:"application/json"}));l.download="job-applications.json";l.click()};
$("import").onclick=()=>$("file").click();
$("file").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d))throw 0;apps=d.map(a=>({id:crypto.randomUUID(),updated:Date.now(),...a}));save();render()}catch(_){alert("That file is not a valid export from this tracker.")}e.target.value=""};
render();
</script>
</body>
</html>
